name: Publish Godbite
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Pages availability
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Build passed. Enable GitHub Pages after upgrading the account plan, then run this workflow again.');
              core.setOutput('enabled', 'false');
            }
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages-enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
